<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-labelledby="title desc">
  <title id="title">Cascading research swarm</title>
  <desc id="desc">A bounded question fans out to independent code, reference and runtime scouts. A challenger tests contradictions, a synthesizer produces acceptance criteria, and uncertainty triggers a targeted second pass.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#636E7B" />
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#F0883E" />
    </marker>
  </defs>
  <style>
    .title { font: 650 21px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #E6EDF3; }
    .sub { font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #768390; }
    .stage { font: 600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #636E7B; letter-spacing: 1px; }
    .node-title { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #E6EDF3; }
    .node-sub { font: 400 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #768390; }
    .box { fill: #0D1117; stroke: #30363D; stroke-width: 1.5; }
    .box-accent { fill: #0D1117; stroke: #F0883E; stroke-width: 1.5; }
    .wire { fill: none; stroke: #3D444D; stroke-width: 1.5; marker-end: url(#arrow); }
    .feedback { fill: none; stroke: #F0883E; stroke-width: 1.5; stroke-dasharray: 5 6; marker-end: url(#arrow-accent); }
    .reveal { opacity: 0; animation: reveal .55s cubic-bezier(.16,1,.3,1) forwards; }
    .r1 { animation-delay: .1s } .r2 { animation-delay: .25s } .r3 { animation-delay: .4s }
    .r4 { animation-delay: .55s } .r5 { animation-delay: .7s }
    @keyframes reveal { from { opacity: 0; transform: translateX(-5px) } to { opacity: 1; transform: none } }
    @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; animation: none } }
  </style>

  <text class="title" x="28" y="32">CASCADING RESEARCH</text>
  <text class="sub" x="28" y="54">Fan out broadly once. Go deeper only where independent evidence disagrees.</text>

  <text class="stage" x="34" y="93">QUESTION</text>
  <text class="stage" x="184" y="93">INDEPENDENT SCOUTS</text>
  <text class="stage" x="418" y="93">CHALLENGE</text>
  <text class="stage" x="600" y="93">SYNTHESIZE</text>
  <text class="stage" x="760" y="93">CONTRACT</text>

  <g class="reveal r1">
    <rect class="box-accent" x="28" y="132" width="112" height="74" rx="8" />
    <text class="node-title" x="84" y="162" text-anchor="middle">BOUND IT</text>
    <text class="node-sub" x="84" y="181" text-anchor="middle">one decision</text>
  </g>

  <g class="reveal r2">
    <rect class="box" x="184" y="104" width="160" height="54" rx="8" />
    <text class="node-title" x="200" y="128">CODE SCOUT</text>
    <text class="node-sub" x="200" y="146">owners and callers</text>
    <rect class="box" x="184" y="170" width="160" height="54" rx="8" />
    <text class="node-title" x="200" y="194">REFERENCE SCOUT</text>
    <text class="node-sub" x="200" y="212">contracts and prior art</text>
    <rect class="box" x="184" y="236" width="160" height="54" rx="8" />
    <text class="node-title" x="200" y="260">RUNTIME SCOUT</text>
    <text class="node-sub" x="200" y="278">logs and artifacts</text>
  </g>

  <g class="reveal r3">
    <rect class="box-accent" x="418" y="132" width="132" height="74" rx="8" />
    <text class="node-title" x="484" y="158" text-anchor="middle">CHALLENGER</text>
    <text class="node-sub" x="484" y="177" text-anchor="middle">find conflict</text>
    <text class="node-sub" x="484" y="193" text-anchor="middle">and missing proof</text>
  </g>

  <g class="reveal r4">
    <rect class="box" x="600" y="132" width="124" height="74" rx="8" />
    <text class="node-title" x="662" y="158" text-anchor="middle">SYNTHESIZER</text>
    <text class="node-sub" x="662" y="177" text-anchor="middle">surviving claims</text>
    <text class="node-sub" x="662" y="193" text-anchor="middle">plus uncertainty</text>
  </g>

  <g class="reveal r5">
    <rect class="box-accent" x="760" y="132" width="92" height="74" rx="8" />
    <text class="node-title" x="806" y="158" text-anchor="middle">ACCEPT</text>
    <text class="node-sub" x="806" y="177" text-anchor="middle">criteria</text>
    <text class="node-sub" x="806" y="193" text-anchor="middle">and task DAG</text>
  </g>

  <path class="wire" d="M140 169 H172" />
  <path class="wire" d="M344 131 C376 131 382 153 406 163" />
  <path class="wire" d="M344 197 H406" />
  <path class="wire" d="M344 263 C376 263 382 219 406 205" />
  <path class="wire" d="M550 169 H588" />
  <path class="wire" d="M724 169 H748" />
  <path class="feedback" d="M662 218 C630 312 348 316 265 296" />
  <text class="stage" x="462" y="315" text-anchor="middle">TARGETED SECOND PASS WHEN UNCERTAINTY SURVIVES</text>
</svg>
