<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" role="img" aria-labelledby="title desc">
  <title id="title">Closed-loop agent harness</title>
  <desc id="desc">Work moves from brief through research, implementation, verification, review, merge and observation, then feeds back into the next brief.</desc>
  <style>
    .title { font: 650 21px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1F2328; letter-spacing: -.4px; }
    .sub { font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #59636E; }
    .label { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636E; letter-spacing: .8px; }
    .center { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1F2328; letter-spacing: 1.2px; }
    .center-sub { font: 400 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #59636E; }
    .loop-base { fill: none; stroke: #D1D9E0; stroke-width: 2; path-length: 100; stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1.1s cubic-bezier(.16,1,.3,1) .2s forwards; }
    .trace { fill: none; stroke: #BC4C00; stroke-width: 2.5; stroke-linecap: round; path-length: 100; stroke-dasharray: 8 92; stroke-dashoffset: 8; opacity: 0; animation: trace-in .01s linear 1.25s forwards, travel 8s linear 1.25s infinite; }
    .node { fill: #FFFFFF; stroke: #818B98; stroke-width: 1.5; opacity: 0; animation: node-in .35s cubic-bezier(.16,1,.3,1) forwards; }
    .n1 { animation-delay: .35s } .n2 { animation-delay: .47s } .n3 { animation-delay: .59s } .n4 { animation-delay: .71s }
    .n5 { animation-delay: .83s } .n6 { animation-delay: .95s } .n7 { animation-delay: 1.07s }
    .gate { stroke: #BC4C00; }
    .pulse-ring, .pulse-core { opacity: 0; transform-box: fill-box; transform-origin: center; animation-duration: 8s; animation-timing-function: linear; animation-delay: var(--pulse-delay); animation-iteration-count: infinite; pointer-events: none; }
    .pulse-ring { fill: none; stroke: #BC4C00; stroke-width: 1.5; animation-name: node-pulse; }
    .pulse-core { fill: #BC4C00; animation-name: node-hit; }
    .p1 { --pulse-delay: 1.25s } .p2 { --pulse-delay: 2.27s } .p3 { --pulse-delay: 3.31s }
    .p4 { --pulse-delay: 4.30s } .p5 { --pulse-delay: 4.78s } .p6 { --pulse-delay: 5.80s } .p7 { --pulse-delay: 7.28s }
    .copy { opacity: 0; animation: copy-in .6s cubic-bezier(.16,1,.3,1) .85s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    @keyframes trace-in { to { opacity: 1 } }
    @keyframes travel { to { stroke-dashoffset: -92 } }
    @keyframes node-in { from { opacity: 0; transform: scale(.55) } to { opacity: 1; transform: scale(1) } }
    @keyframes node-pulse {
      0% { opacity: 0; transform: scale(.9) }
      1.5% { opacity: .78; transform: scale(1) }
      7% { opacity: 0; transform: scale(2.35) }
      7.01%, 100% { opacity: 0; transform: scale(2.35) }
    }
    @keyframes node-hit {
      0% { opacity: 0; transform: scale(1) }
      1.5% { opacity: .95; transform: scale(1) }
      3.5% { opacity: .82; transform: scale(1.35) }
      7% { opacity: 0; transform: scale(1) }
      7.01%, 100% { opacity: 0; transform: scale(1) }
    }
    @keyframes copy-in { from { opacity: 0; transform: translateY(5px) } to { opacity: 1; transform: none } }
    @media (prefers-reduced-motion: reduce) {
      .loop-base { stroke-dashoffset: 0; animation: none }
      .trace { stroke-dashoffset: 0; opacity: 1; animation: none }
      .pulse-ring, .pulse-core { opacity: 0; animation: none }
      .node, .copy { opacity: 1; animation: none }
    }
  </style>

  <text class="title" x="28" y="32">THE HARNESS IS A CONTROL LOOP</text>
  <text class="sub" x="28" y="54">A generated diff is an input. Evidence decides whether it survives.</text>

  <path class="loop-base" pathLength="100" d="M132 88 H748 C790 88 816 112 816 140 C816 168 790 192 748 192 H132 C90 192 64 168 64 140 C64 112 90 88 132 88 Z" />
  <path class="trace" pathLength="100" d="M132 88 H748 C790 88 816 112 816 140 C816 168 790 192 748 192 H132 C90 192 64 168 64 140 C64 112 90 88 132 88 Z" />

  <circle class="node n1" cx="132" cy="88" r="5" />
  <circle class="node n2" cx="338" cy="88" r="5" />
  <circle class="node n3" cx="548" cy="88" r="5" />
  <circle class="node gate n4" cx="748" cy="88" r="5" />
  <circle class="node gate n5" cx="816" cy="140" r="5" />
  <circle class="node n6" cx="638" cy="192" r="5" />
  <circle class="node gate n7" cx="338" cy="192" r="5" />

  <g class="pulse p1"><circle class="pulse-ring" cx="132" cy="88" r="5" /><circle class="pulse-core" cx="132" cy="88" r="5" /></g>
  <g class="pulse p2"><circle class="pulse-ring" cx="338" cy="88" r="5" /><circle class="pulse-core" cx="338" cy="88" r="5" /></g>
  <g class="pulse p3"><circle class="pulse-ring" cx="548" cy="88" r="5" /><circle class="pulse-core" cx="548" cy="88" r="5" /></g>
  <g class="pulse p4"><circle class="pulse-ring" cx="748" cy="88" r="5" /><circle class="pulse-core" cx="748" cy="88" r="5" /></g>
  <g class="pulse p5"><circle class="pulse-ring" cx="816" cy="140" r="5" /><circle class="pulse-core" cx="816" cy="140" r="5" /></g>
  <g class="pulse p6"><circle class="pulse-ring" cx="638" cy="192" r="5" /><circle class="pulse-core" cx="638" cy="192" r="5" /></g>
  <g class="pulse p7"><circle class="pulse-ring" cx="338" cy="192" r="5" /><circle class="pulse-core" cx="338" cy="192" r="5" /></g>

  <text class="label" x="132" y="76" text-anchor="middle">BRIEF</text>
  <text class="label" x="338" y="76" text-anchor="middle">RESEARCH</text>
  <text class="label" x="548" y="76" text-anchor="middle">IMPLEMENT</text>
  <text class="label" x="748" y="76" text-anchor="middle">VERIFY</text>
  <text class="label" x="827" y="144">REVIEW</text>
  <text class="label" x="638" y="217" text-anchor="middle">MERGE</text>
  <text class="label" x="338" y="217" text-anchor="middle">OBSERVE</text>

  <g class="copy">
    <text class="center" x="440" y="132" text-anchor="middle">RESEARCH  /  BUILD  /  DISPROVE</text>
    <text class="center-sub" x="440" y="154" text-anchor="middle">failure routes work backward; production evidence starts the next pass</text>
  </g>

  <text class="sub" x="28" y="256">No stage earns trust by existing. It earns trust by rejecting a known-bad input.</text>
</svg>
